name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit and UI tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          # Prefer 26.6; fall back to 26.4 until the runner image catches up
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create stub Secrets.swift
        run: cp Lyttejeger/Config/Secrets.example.swift Lyttejeger/Config/Secrets.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Find iPhone simulator
        id: simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = data.get('devices', {})
          for runtime, device_list in sorted(devices.items(), reverse=True):
            if 'iOS' not in runtime and 'com.apple.CoreSimulator.SimRuntime.iOS' not in runtime:
              continue
            for d in device_list:
              if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                print(d['name'])
                sys.exit(0)
          print('iPhone 16')
          ")
          echo "name=$SIMULATOR" >> "$GITHUB_OUTPUT"
          echo "Found simulator: $SIMULATOR"

      # LyttejegerNetworkedUITests is deliberately absent: it needs real
      # Podcast Index keys. The deterministic UI class runs against the stub
      # Secrets above, because it never searches.
      - name: Run unit and UI tests
        run: |
          xcodebuild \
            -project Lyttejeger.xcodeproj \
            -scheme Lyttejeger \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -testLanguage nb \
            -testRegion NO \
            -only-testing:LyttejegerTests \
            -only-testing:LyttejegerUITests/LyttejegerUITests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      # The test build is Debug. Without this step a Release-only failure --
      # an optimizer or concurrency difference, or DEBUG-only code such as
      # UITestSupport failing to compile out -- reaches TestFlight unnoticed.
      - name: Release build
        run: |
          xcodebuild \
            -project Lyttejeger.xcodeproj \
            -scheme Lyttejeger \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
